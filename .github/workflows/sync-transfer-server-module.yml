name: Sync Transfer Server Module
permissions:
  contents: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'main.tf'
      - 'outputs.tf'
      - 'variables.tf'
      - 'versions.tf'

jobs:
  sync-module:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Copy Terraform files to transfer-server module
        run: |
          cp main.tf outputs.tf variables.tf versions.tf modules/transfer-server/

      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.20.0/terraform-docs-v0.20.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/

      - name: Generate terraform-docs
        run: |
          terraform-docs markdown table --output-file README.md --output-mode inject modules/transfer-server

      - name: Commit all changes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add modules/transfer-server/
          git diff --staged --quiet || (git commit -m "chore: sync transfer-server module files and update documentation" && git push origin "$HEAD_REF")
